[package]
name = "herdr-browser-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CEF off-screen host for the browser block; `--stub` serves deterministic frames without CEF."

[[bin]]
name = "herdr-browser-host"
path = "src/main.rs"

[dependencies]
herdr-browser-protocol = { path = "../herdr-browser-protocol" }
herdr-browser-surface = { path = "../herdr-browser-surface" }
serde_json = "1"
libc = "0.2"
cef = { version = "=156.2.0", default-features = false, optional = true }
png = { version = "0.17", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"], optional = true }
objc2-io-surface = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "objc2-io-surface", "MTLDevice", "MTLTexture", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLBlitCommandEncoder", "MTLPixelFormat", "MTLTypes", "MTLAllocation"], optional = true }

[features]
# The real host: CEF off-screen rendering. Needs CEF_PATH, cmake and ninja (docs/fork-host.md).
cef = ["dep:cef", "dep:png", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-io-surface", "dep:objc2-metal"]

[dev-dependencies]
libc = "0.2"
